{% extends 'blog/base.html' %}

{% load static %}
{% load blog_extras %}

{% block content %}
    <!-- main content  -->
                <div class="layout">
                    {% include 'blog/aside.html' %}
                    <main class="main-content container" >
                        <div class="row d-flex justify-content-between">                            
                            <div class="col-md-8"> 
                                    <div class="sub-nav sticky-top ">
                                        <div class="wrapper">
                                            <div class="icon"><i id="left" class="bi bi-arrow-left"></i>
                                            </div>
                                            <div class="tabs-box ">
                                                <a href="" class="custom-hover align-content-center px-3 py-2 rounded-3"><i class="bi bi-plus-lg fw-bolder"></i> </a>

                                                <a href="{% url 'home' %}" class="category-link custom-hover active" data-id="all">All</a>

                                                {% for cat in categories %}
                                                <a href="#" data-id="{{ cat.id }}" class=" category-link">{{ cat.category_name }}</a>
                                                {% endfor %}
                                            </div>

                                            <div class="icon"><i id="right" class="bi bi-arrow-right"></i>
                                            </div>
                                        </div>
                                    </div>  

                                    <div id="post-container" class="mt-5 p-2">
                                        {% include 'blog/partials/posts.html' %}
                                    </div>
                                    <div id="more-data" class="text-center mt-2 mb-4"></div>
                            </div>
                            <!-- Right: Sticky Sidebar -->
                                {% include 'blog/aside2.html' %}
                        </div>   
                    </main>

                </div>

 


{% endblock %}
