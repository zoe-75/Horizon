{% extends "blog/base.html" %} 

{% load static %}
{% load blog_extras %}

{% block content %}
<div class="layout">
  <div class="main-content " >
    <div class="modal modal-sheet position-static d-block  p-1 py-md-5" tabindex="-1" role="dialog" id="modalSignin">
      <div class="modal-dialog" style="padding-bottom: 100px;">
        <div class="modal-content  shadow" >
          <div class="modal-header p-5 pb-4 border-bottom-0">
            <h1 class="fw-bold mb-0 fs-2">Reset sent</h1>
            <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> -->
          </div>
          <div class="modal-body p-5 pt-0">
            {% if messages %}
              {% for message in messages %}
                    {% if message.tags == 'error' %}
                        <center><h4 style="color: firebrick;"> {{message}} </h4></center>
                        {% else %}
                        <center><h4 style="color: dodgerblue;"> {{message}} </h4></center>
                    {% endif %}
              {% endfor %}
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
