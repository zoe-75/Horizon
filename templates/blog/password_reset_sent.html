<!DOCTYPE html>
{% extends "blog/base.html" %} 
{% load socialaccount %}

{% load static %}
{% load blog_extras %}

{% block content %}
<div class="layout">
  <div class="main-content " >
    <div class="modal modal-sheet position-static d-block  p-1 py-md-5" tabindex="-1" role="dialog" id="modalSignin">
      <div class="modal-dialog" style="padding-bottom: 100px;">
        <div class="modal-content  shadow" >
          <center class="modal-header p-5 pb-4 border-bottom-0 d-block">
            <div class="logo"><div class="spinner">
              </div>
            </div>
            <h1 class="fw-bold mb-0 fs-2 mt-2">Resent sent</h1>
          </center>


          <div class="modal-body p-5 pt-0">
         <center>
            <div class="signup_link" style="padding: 10px;">A password reset link has been sent to your email. Please note that it <b>expires in 10 minutes</b>!</div>
        </center>
            <div class="d-flex gap-2"><h6 class="truncate">Remember your password?</h6> <span><a class="link" href="{% url 'login' %}">Log in</a></span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
