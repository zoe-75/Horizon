{% extends 'blog/base.html' %}
{% load socialaccount %}

{% block content %}
<div class="layout">
  <div class="main-content" style="padding-bottom: 80px;" >
    <div class="modal modal-sheet position-static d-block  p-4 py-md-5" tabindex="-1" role="dialog" id="modalSignin" >
        <div class="modal-dialog">
          <div class="modal-content  shadow" style="font-family: 'Rubik';">
            <div class="modal-header p-5 pb-4 border-bottom-0">
              <h1 class="fw-bold mb-0 fs-2">Sign up for free</h1>
              <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> -->
            </div>
      
            <div class="modal-body p-5 pt-0">
              <form class="">
              <a class="w-100  mb-2 btn rounded-3 p-3" href="{% provider_login_url 'google' method='oauth2' process='login' %}">
                <i class="bi bi-google"></i> Login with Google
              </a>

              <a class="w-100  mb-2 btn rounded-3 p-3" href="{% provider_login_url 'github' method='oauth2' process='login' %}">
                <i class="bi bi-github"></i> Continue with GitHub
              </a>



                <div class="d-flex align-items-center my-2">
                  <hr class="flex-grow-1 border" />
                  <span class="mx-2 fw-bold">OR</span>
                  <hr class="flex-grow-1 border" />
                </div>
                <!-- <h2 class="fs-5 fw-bold mb-3">Or use a third-party</h2> -->

                  <div class="mb-3">
                    Email
                  <input type="email" class="form-control rounded-3 " id="floatingInput" placeholder="name@example.com">
                  <!-- <label for="floatingInput">Email address</label> -->
                </div>
                <div class="mb-3">
                  Password
                  <input type="password" class="form-control rounded-3" id="floatingPassword" placeholder="Password">
                  <!-- <label for="floatingPassword">Password</label> -->
                </div>
                <button class="w-100 mb-2 btn2 btn-lg rounded-3 btn-primary " type="submit">Sign up</button>
                <small class="text-white">By signing up, you agree to our Terms of Service and Privacy Policy</small>
              </form>
            </div>
          </div>
        </div>
    </div> 
  </div>
</div>



{% endblock %}
