{% load static %}
{% load blog_extras %}

<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/horizon.jpg' %}"> 
   <title>Horizon</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css ">
   <!-- Bootstrap CSS -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="css/bootstrap.min.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
   <link rel="stylesheet" href="{% static 'css/slick.css' %}?v=2">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simple-line-icons/2.5.5/css/simple-line-icons.min.css">
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="{% static 'cs/index.css' %}?v=1">


</head>
<body class="darkmode">
    <div class="site-wrapper">
        <div class="main-overlay"></div>  
        <header class="header-default navbar navbar-expand-lg bd-navbar sticky-top">   
                <nav class="container-xxl bd-gutter flex-wrap flex-lg-nowrap" aria-label="Main navigation">
                    <ul class="navbar nav me-auto">
                        <a class="logo d-flex align-items-end small gap-2 " href="{% url 'home' %}" ><img src="{% static 'images/hit.png' %}" data-bs-toggle="tooltip" data-bs-placement="top" title="Horizon.com" class="img-fluid" style="max-width: 25px;" ><span class="gradient-text">horizon..</span></a> 

                        <a href=" {% url 'home' %}">
                            <li class="nav-link yes">
                                Home
                            </li>
                        </a>                       
                        <a href="">
                            <li class="nav-link  yes">
                                About
                            </li>
                        </a>
                            <a href="">
                            <li class="nav-link  yes">
                                Blog
                            </li>
                        </a>

                    </ul>
                    		<div class="col-md-5 ">
								<form  action="{% url 'search' %}" method="GET"  class="rounded position-relative">
									<input  value="{{keyword}}" name="keyword"  class="form-control pe-5 bg-transparent" type="search" placeholder="Search" aria-label="Search" required>
									<button class="btn bg-transparent border-0 px-2 py-0 position-absolute top-50 end-0 translate-middle-y" type="submit"><i class="fas fa-search fs-6 "></i></button>
								</form>
							</div>
                        <!-- <form action="{% url 'search' %}" method="GET" class="position-relative sach">
                        <input type="text"  value="{{keyword}}" name="keyword" class="form-control  bg-dark bg-opacity-10 rounded-3 text-white" placeholder="Search" required>
                        <button type="submit" class="btn1 position-absolute translate-middle-y  text-white">
                          <i class="bi bi-search text-white fs-4"></i>
                        </button>
                      </form> -->
                      
                        <div class="header-right yes">
                        <div class="header-buttons">
                            <a href="" class=" btns icon-button1  fw-bold  bg-danger bg-opacity-10 rounded-3 text-danger" >   
                            <i class="icon-bell fw-bolder fs-5"></i></a>
                            <a href="" class="btns icon-button2 fw-bold bg-success bg-opacity-10 rounded-3 text-success" >   
                            <i class="fa-solid fa-pen-to-square fw-bolder fs-5"></i></a>                           
                             <a href="" class="btns icon-button3 fw-bold  bg-primary bg-opacity-10 rounded-3 text-primary" >   
                            <i class="icon-chart fw-bolder fs-5"></i></a>

                            {% if not user.is_authenticated %}
                            <a href="{% url 'login' %}" class=" icon-button4 p-2 fw-bold rounded-1" style="background: var(--color-bg); color: var(--color-text);">Login <i class="icon-login fw-bolder ps-2"></i></a>
                            <a  class="nav-item"><a href="{% url 'register' %}" class=" icon-button5 px-2 bg-info bg-opacity-10 rounded-3 text-info">SignUp</a></a>
                            {% else %}
                            
                            <a href="{% url 'logout' %}" class=" fw-bold rounded-1 icon-button4 bg-info bg-opacity-10 rounded-3 text-info" >  Logout <i class="icon-logout fw-bolder ps-2"></i></a>
                            {% endif %}
<!-- 
                            <button id="theme-toggle" class="icon-button btn-sm btn-light">
                            <span id="theme-icon">🌙</span> 
                            </button> -->
                        </div>
                        </div>

                        <i class="bi bi-text-left rtl-flip fs-5" data-bs-target="#offcanvasMenu"> </i>
                    </a> -->
                </nav>  
          
          </header>    

        <!-- section starts  -->

        {% block content %}
        

        {% endblock %}

    <!-- javascripts  -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'jsx/jquery.min.js' %}?v=1"></script>
    <script src="{% static 'jsx/popper.min.js' %}?v=1"></script>
    <script src="{% static 'jsx/bootstrap.min.js' %}?v=1"></script>
    <script src="{% static 'jsx/slick.min.js' %}?v=1"></script>
    <script src="{% static 'jsx/jquery.sticky-sidebar.min.js' %}?v=1"></script>
    <script src="{% static 'jsx/main.js' %}?v=3"></script> 
</body>

</html>
