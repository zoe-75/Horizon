
{% load static %}
{% load blog_extras %}

{% block content %}

    {% for post in posts %}   

            <div class="p-1 bordered mb-4 ">
            <div class="row g-2 align-items-center flex-md-row flex-column justify-content-between">                         
                <!-- Text Section -->
                <div class="col-md-8 col-12 p-2">
                 	<div class="card-header mt-2 mb-1" style="font-family: 'Rubik';">
						<div class="d-flex align-items-center justify-content-between">
							<div class="d-flex align-items-start mb-2">
								<!-- Avatar -->
								<div class="avatar ">
									<a href="#!"> <img class="avatar-img" src="{% static 'images/person.jpg' %}" alt=""> </a>
								</div>
								<!-- Info -->
								<div>
									<h6 class="card-title mb-0"> <a href="#!"> {{ post.author}} {{ post.author.last_name }} • <span class="small mb-0   truncate">{{ post.created_at|smart_timesince }}</span></a></h6>
								</div>
							</div>
							<!-- Card share action START -->
						</div>
					</div>
                    
                    <h4 class="mb-3" style="font-weight: 750; line-height: 1.2;">
                        <a href="{% url 'blogs' post.slug %}" class="ajax-link">{{ post.title }}</a>
                    </h4>
                
                    <p class=" mb-4 truncate">{{ post.blog_body|truncatechars:120 }}</p>
                
                    <div class="d-flex align-items-center gap-4 small flex-wrap truncate cursor-pointer mb-3 fs-6">

                        <a href=""><span class=" text-info"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#434343"><path d="M200-120v-640q0-33 23.5-56.5T280-840h240v80H280v518l200-86 200 86v-278h80v400L480-240 200-120Zm80-640h240-240Zm400 160v-80h-80v-80h80v-80h80v80h80v80h-80v80h-80Z"/></svg></span></a>

                    </div>
                </div>
            
                <!-- Thumbnail -->
                <div class="col-md-3 col-12">
                    <a href="{% url 'blogs' post.slug %}" class="ajax-link">
                        <div class="innert">
                        <img src="{{ post.featured_image.url }}" alt="Post thumbnail" class="img-fluid  " />
                        </div>
                    </a>
                </div>
            </div>
        </div>



    {% endfor %}

{% endblock %}
