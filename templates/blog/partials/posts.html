
{% load static %}
{% load blog_extras %}

{% block content %}

    {% for post in posts %}   

            <div class="p-3  bordered mb-4 py-3">
            <div class="row g-2 align-items-center flex-md-row flex-column justify-content-between">                         
                <!-- Text Section -->
                <div class="col-md-8 col-12 ">
                 	<div class="card-header mt-2 mb-3 ">
							<div class=" d-flex align-items-center mb-2 gap-1">
								<!-- Avatar -->
								<div class="avatar ">
									<a href="#!"> <img class="avatar-img" src="{% static 'images/11.png' %}" alt=""> </a>
								</div>
								<!-- Info -->
								<div>
									<h6 class="card-title mb-0 "> <a href="#!"> {{ post.author}} • <span class="f ">Follow</span></a>
                                    </h6>
                                    <span class="small mb-0   truncate">{{ post.created_at|smart_timesince }}</span>
								</div>
							</div>
					</div>
                    
                    <h4 class="title mb-3" >
                        <a href="{% url 'blogs' post.slug %}" class="ajax-link">{{ post.title }}</a>
                    </h4>
                
                    <p class=" mb-4 truncate">{{ post.blog_body|truncatechars:120 }}</p>
                
                    <div class=" none d-flex align-items-center flex-wrap gap-3 text-center justify-content-between">
                        <a href=""><span class=" star text-warning"> <i class="bi bi-stars"></i> </span></a>

                        <a href=""><span class="reactions1"><i class="bi bi-suit-heart gap-2"></i> 20</span></a>

                        <a href=""><span class="reactions2"> <i class="bi bi-chat-left-text gap-2"></i> 65</span></a>
                        <a href=""><span class="reactions4"> <i class="bi bi-bar-chart-line gap-2"></i> 5</span></a>

                        <a href=""><span class="reactions3">
                            <i class="bi bi-bookmark-heart"></i> 
                        </span>
                        </a>

                        <a href="">
                            <span class="reactions4"><i class=" bi bi-share"></i></span> 
                        </a>
                    </div>
                </div>
            
                <!-- Thumbnail -->
                <div class="col-md-3 col-12">
                    <a href="{% url 'blogs' post.slug %}" class="ajax-link">
                        <div class="innert">
                        <img src="{{ post.featured_image.url }}" alt="Post thumbnail" class="img-fluid  " />
                        </div>
                    </a>
                </div>

                    <div class="rec d-flex align-items-center  gap-2 justify-content-between">
                        <a href=""><span class=" star text-warning"> <i class="bi bi-stars"></i> </span></a>

                        <a href=""><span class="reactions1"><i class="bi bi-heart gap-2"></i> </span> 20</a>

                        <a href=""><span class="reactions2"> <i class="bi bi-chat-left-text gap-2"></i> </span> 5</a>
                        <a href=""><span class="reactions4"> <i class="bi bi-bar-chart-line gap-2"></i> 5</span></a>


                        <a href=""><span class="reactions3">
                            <i class="bi bi-bookmark-heart"></i> 
                        </span>9
                        </a>

                        <a href="">
                            <span class="reactions4"><i class=" bi bi-share"></i></span> 2
                        </a>
                    </div>
            </div>
        </div>



    {% endfor %}

{% endblock %}
