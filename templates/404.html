              </div>

                <input type="password" class="form-control rounded-3" id="floatingPassword" placeholder="Password">

              </div>

{% block content %}
<div class="main-content">
  <div class="catt dash text-white">
  {% load crispy_forms_tags  %}
    <h3 class="text-center">Sign up for free</h3>
    <div class="container col-lg-5" >
    <form  class="card  padding-20 rounded "  action="{% url 'register' %}" method="POST" style="width: auto; margin: auto;">
        {% csrf_token %}
        {{ form | crispy }}
        <button type="submit" class="btn  mt-4 btn-warning">Sign up</button>
    </form>
    </div>
{% endblock %}
</div>
</div>
